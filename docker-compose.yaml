services:
  ndc-pinot:
    image: ndc-pinot-debug
    build:
      context: .
      args:
        # enable debug assertions to run debug code in our local build
        RUSTFLAGS: -C debug-assertions=true
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      HASURA_CONNECTOR_PORT: 5000
      HASURA_CONFIGURATION_DIRECTORY: /etc/connector
      PINOT_CONTROLLER_URL: http://pinot-controller:9000
      PINOT_BROKER_URL: http://pinot-broker:8099
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "ndc-pinot"
      RUST_LOG: debug
    volumes:
      - ./tests/config:/etc/connector
    command: serve
    depends_on:
      jaeger:
        condition: service_started
      pinot-broker:
        condition: service_started

  # Apache Pinot is deployed as a standard multi-process cluster (not the
  # single-container quickstart image), matching a realistic production topology:
  # a ZooKeeper ensemble for cluster metadata, one controller, one broker and one
  # server. See tests/pinot-db/init/seed.sh for creating the sample table once the
  # cluster is up.
  zookeeper:
    image: zookeeper:3.9
    restart: unless-stopped
    ports:
      - "2181:2181"

  pinot-controller:
    image: apachepinot/pinot:latest
    command: StartController -zkAddress zookeeper:2181
    restart: unless-stopped
    ports:
      - "9000:9000"
    # mounted so tests/pinot-db/init/seed.sh can `docker compose exec` into this
    # container and run pinot-admin.sh against the schema/table/data files it
    # writes here - see that script for details
    volumes:
      - ./tests/pinot-db/init:/tmp/pinot-init
    depends_on:
      zookeeper:
        condition: service_started

  pinot-broker:
    image: apachepinot/pinot:latest
    command: StartBroker -zkAddress zookeeper:2181
    restart: unless-stopped
    ports:
      - "8099:8099"
    depends_on:
      pinot-controller:
        condition: service_started

  pinot-server:
    image: apachepinot/pinot:latest
    command: StartServer -zkAddress zookeeper:2181
    restart: unless-stopped
    ports:
      - "8098:8098"
    depends_on:
      pinot-broker:
        condition: service_started

  engine:
    image: ghcr.io/hasura/v3-engine
    restart: unless-stopped
    environment:
      METADATA_PATH: /metadata.json
      AUTHN_CONFIG_PATH: /auth-config.json
      OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: debug
    ports:
      - 3000:3000
    volumes:
      - ./tests/engine/metadata.json:/metadata.json
      - ./tests/engine/auth-config.json:/auth-config.json
    depends_on:
      jaeger:
        condition: service_started
      auth-hook:
        condition: service_started
    develop:
      watch:
        - path: ./tests/engine/metadata.json
          target: /metadata.json
          action: sync+restart
        - path: ./tests/engine/auth-config.json
          target: /auth-config.json
          action: sync+restart

  auth-hook:
    image: ghcr.io/hasura/v3-dev-auth-webhook
    restart: unless-stopped
    environment:
      OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3050:3050"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.55
    restart: always
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686 # Jaeger UI
      - 14250:14250
      - 14268:14268
      - 14269:14269
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP
      - 9411:9411
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"
